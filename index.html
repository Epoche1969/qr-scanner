<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>출첵 스캐너</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      margin-top: 18px;
    }

    h1 {
      margin: 0;
      color: #0f2e6e;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .sub {
      margin-top: 8px;
      color: #64748b;
      font-size: 17px;
      line-height: 1.5;
      font-weight: 700;
    }

    .camera-box {
      margin-top: 20px;
      border-radius: 18px;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid #cbd5e1;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      min-height: 260px;
      display: block;
      background: #0f172a;
      object-fit: cover;
    }

    video.front-camera {
      transform: scaleX(-1);
    }

    canvas {
      display: none;
    }

    .result {
      display: block;
      margin-top: 20px;
      padding: 26px 18px;
      border-radius: 18px;
      text-align: center;
      font-weight: 900;
      line-height: 1.5;
      background: #eff6ff;
      color: #0f2e6e;
      border: 2px solid #bfdbfe;
      min-height: 72px;
      box-sizing: border-box;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
      border-color: #22c55e;
    }

    .fail {
      background: #fef2f2;
      color: #dc2626;
      border-color: #ef4444;
    }

    .waiting {
      background: #eff6ff;
      color: #0f2e6e;
      border-color: #bfdbfe;
    }

    .big-name {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .big-type {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .big-time {
      font-size: 20px;
      color: #334155;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      min-height: 54px;
    }

    .check-in { background: #2563eb; }
    .check-out { background: #7c3aed; }
    .start { background: #047857; }
    .stop { background: #dc2626; }
    .camera { background: #334155; }
    .manual-btn { background: #2563eb; width: 100%; }
    .reset-btn { background: #b45309; width: 100%; margin-top: 10px; }

    .active-mode {
      outline: 4px solid #fbbf24;
      outline-offset: 0;
    }

    .manual {
      margin-top: 24px;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .manual h2 {
      margin: 0 0 12px 0;
      color: #0f2e6e;
      font-size: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .small {
      margin-top: 14px;
      color: #64748b;
      font-size: 13px;
      word-break: break-all;
      line-height: 1.5;
      white-space: pre-line;
    }

    @media (max-width: 520px) {
      .button-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }

      .big-name {
        font-size: 28px;
      }

      .big-type {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>출첵 스캐너</h1>
      <div class="sub">전면 카메라 우선 사용. 반드시 “스캔 시작”을 눌러 카메라 권한을 허용해주세요.</div>

      <div class="camera-box">
        <video id="video" class="front-camera" autoplay playsinline muted></video>
      </div>
      <canvas id="canvas"></canvas>

      <div id="result" class="result waiting">스캔 시작 버튼을 눌러주세요.</div>

      <div class="button-grid">
        <button id="checkInButton" class="check-in active-mode" onclick="setCheckType('출근')">출근 모드</button>
        <button id="checkOutButton" class="check-out" onclick="setCheckType('퇴근')">퇴근 모드</button>
      </div>

      <div class="button-grid">
        <button class="start" onclick="startScanner('user')">스캔 시작</button>
        <button class="stop" onclick="stopScanner()">스캔 중지</button>
      </div>

      <div class="button-grid">
        <button class="camera" onclick="startScanner('user')">전면 카메라 재시도</button>
        <button class="camera" onclick="startScanner('environment')">후면 카메라 재시도</button>
      </div>

      <button class="reset-btn" onclick="resetCameraGuide()">카메라 권한 안내</button>

      <div class="manual">
        <h2>카메라가 안 될 때 직접 입력</h2>
        <input id="manualToken" type="text" placeholder="예: EMP004-ABC12345">
        <button class="manual-btn" onclick="submitManual()">직접 출첵</button>
      </div>

      <div class="small" id="statusText"></div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPDHypVwpaqEdAYUUAj8AGkgaEh4e0zEbp6cr46ru9JldynWDirfV9TpY6DB9JV6aO/exec';

    let videoStream = null;
    let scanTimer = null;
    let isProcessing = false;
    let lastToken = '';
    let lastScanTime = 0;
    let checkType = '출근';
    let cameraFacingMode = 'user';
    let currentCameraLabel = '';

    function setCheckType(type) {
      checkType = type === '퇴근' ? '퇴근' : '출근';

      document.getElementById('checkInButton').classList.toggle('active-mode', checkType === '출근');
      document.getElementById('checkOutButton').classList.toggle('active-mode', checkType === '퇴근');

      showWaiting(checkType + ' 모드입니다. 카메라가 안 켜졌으면 스캔 시작을 눌러주세요.');
      speak(checkType + ' 모드입니다.');
    }

    async function startScanner(mode) {
      unlockSound();
      cameraFacingMode = mode === 'environment' ? 'environment' : 'user';
      setCameraDisplayMode();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showFail('이 브라우저는 카메라 기능을 지원하지 않습니다. Chrome 또는 Safari 최신 버전으로 열어주세요.');
        speak('이 브라우저는 카메라 기능을 지원하지 않습니다.');
        return;
      }

      stopScanner(false);
      showWaiting(getCameraName() + ' 시작 중입니다. 권한 창이 뜨면 허용을 눌러주세요.');
      setStatus('카메라 요청 중...');

      const attempts = buildCameraAttempts(cameraFacingMode);
      let lastError = null;

      for (let i = 0; i < attempts.length; i++) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(attempts[i].constraints);
          await attachStream(stream, attempts[i].label);
          return;
        } catch (error) {
          lastError = error;
          setStatus('카메라 시도 실패: ' + attempts[i].label + '\n' + error.name + ' / ' + error.message);
        }
      }

      playFailSound();
      const msg = makeCameraErrorMessage(lastError);
      showFail(msg);
      setStatus(msg + '\n\n해결: 주소창 왼쪽 자물쇠/설정 아이콘 → 카메라 → 허용 → 새로고침');
      speak('카메라를 시작하지 못했습니다. 카메라 권한을 확인해주세요.');
    }

    function buildCameraAttempts(mode) {
      const preferred = mode === 'environment' ? 'environment' : 'user';
      const other = preferred === 'user' ? 'environment' : 'user';

      return [
        {
          label: preferred === 'user' ? '전면 카메라 정확히 요청' : '후면 카메라 정확히 요청',
          constraints: { video: { facingMode: { exact: preferred }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }
        },
        {
          label: preferred === 'user' ? '전면 카메라 우선 요청' : '후면 카메라 우선 요청',
          constraints: { video: { facingMode: { ideal: preferred }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }
        },
        {
          label: other === 'user' ? '전면/후면 반대 카메라 요청' : '전면/후면 반대 카메라 요청',
          constraints: { video: { facingMode: { ideal: other }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }
        },
        {
          label: '기본 카메라 요청',
          constraints: { video: true, audio: false }
        }
      ];
    }

    async function attachStream(stream, label) {
      const video = document.getElementById('video');
      videoStream = stream;
      video.srcObject = stream;
      video.setAttribute('playsinline', true);
      video.muted = true;

      await video.play();

      const track = stream.getVideoTracks()[0];
      currentCameraLabel = track && track.label ? track.label : label;

      showWaiting(getCameraName() + ' 준비 완료. ' + checkType + ' QR을 보여주세요.');
      setStatus('카메라 작동 중\n사용 카메라: ' + currentCameraLabel + '\n연결 주소: ' + WEB_APP_URL);
      speak(getCameraName() + '가 준비되었습니다.');

      scanTimer = setInterval(scanFrame, 300);
    }

    function stopScanner(showMessage) {
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }

      if (videoStream) {
        videoStream.getTracks().forEach(function(track) {
          track.stop();
        });
        videoStream = null;
      }

      const video = document.getElementById('video');
      if (video) {
        video.pause();
        video.srcObject = null;
      }

      if (showMessage !== false) {
        showWaiting('스캔이 중지되었습니다.');
        setStatus('스캔 중지됨');
        speak('스캔이 중지되었습니다.');
      }
    }

    function scanFrame() {
      if (isProcessing) return;

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');

      if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;
      if (!video.videoWidth || !video.videoHeight) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'attemptBoth'
      });

      if (code && code.data) {
        recordAttendance(code.data);
      }
    }

    function submitManual() {
      unlockSound();
      const token = document.getElementById('manualToken').value.trim();

      if (!token) {
        playFailSound();
        showFail('QR토큰을 입력해주세요.');
        speak('큐알 토큰을 입력해주세요.');
        return;
      }

      recordAttendance(token);
    }

    function recordAttendance(token) {
      const now = Date.now();

      if (isProcessing) return;
      if (token === lastToken && now - lastScanTime < 5000) return;

      lastToken = token;
      lastScanTime = now;
      isProcessing = true;
      showWaiting('QR 확인 중...');

      const callbackName = 'attendanceCallback_' + Date.now();

      window[callbackName] = function(result) {
        delete window[callbackName];

        if (result && result.success) {
          playSuccessSound();
          const name = result.displayName || '직원';
          const type = result.checkType || checkType;
          speak(name + '님 ' + type + '했습니다.');
          showSuccess(
            '<div class="big-name">' + escapeHtml(name) + '님</div>' +
            '<div class="big-type">' + escapeHtml(type) + '했습니다</div>' +
            '<div class="big-time">' + escapeHtml(result.scanTime || '') + '</div>'
          );
          document.getElementById('manualToken').value = '';
        } else {
          playFailSound();
          const message = result && result.message ? result.message : '출첵 실패';
          const name = result && result.displayName ? result.displayName : '';

          if (result && result.duplicate && name) {
            speak(name + '님은 이미 ' + (result.checkType || checkType) + ' 처리되었습니다.');
          } else {
            speak(message);
          }

          showFail(message);
        }

        setTimeout(function() {
          isProcessing = false;
          showWaiting('다음 직원 ' + checkType + ' 스캔 대기중');
        }, 3000);
      };

      const script = document.createElement('script');
      script.src =
        WEB_APP_URL +
        '?api=attendance' +
        '&token=' + encodeURIComponent(token) +
        '&checkType=' + encodeURIComponent(checkType) +
        '&callback=' + callbackName +
        '&t=' + Date.now();

      script.onerror = function() {
        playFailSound();
        speak('서버 연결 실패');
        showFail('서버 연결 실패');
        delete window[callbackName];
        isProcessing = false;
      };

      document.body.appendChild(script);

      setTimeout(function() {
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }, 10000);
    }

    function resetCameraGuide() {
      const guide =
        '카메라 권한 확인 방법\n\n' +
        '1. 주소창 왼쪽 자물쇠 또는 설정 아이콘을 누르세요.\n' +
        '2. 사이트 설정을 누르세요.\n' +
        '3. 카메라를 허용으로 바꾸세요.\n' +
        '4. 페이지를 새로고침하세요.\n' +
        '5. 스캔 시작을 다시 누르세요.';

      showFail(guide);
      setStatus(guide);
      speak('카메라 권한 안내를 확인해주세요.');
    }

    function makeCameraErrorMessage(error) {
      if (!error) return '카메라를 시작하지 못했습니다.';

      if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
        return '카메라 권한이 차단되어 있습니다. 주소창 왼쪽 설정에서 카메라를 허용해주세요.';
      }

      if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
        return '사용 가능한 카메라를 찾지 못했습니다.';
      }

      if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
        return '다른 앱이 카메라를 사용 중일 수 있습니다. 카메라 앱/화상회의 앱을 닫고 다시 시도해주세요.';
      }

      if (error.name === 'OverconstrainedError' || error.name === 'ConstraintNotSatisfiedError') {
        return '요청한 전면/후면 카메라 조건이 맞지 않습니다. 다른 카메라 버튼을 눌러보세요.';
      }

      if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        return '카메라는 HTTPS 주소에서만 작동합니다. GitHub Pages 주소로 열어주세요.';
      }

      return '카메라 시작 실패: ' + error.name + ' / ' + error.message;
    }

    function setCameraDisplayMode() {
      const video = document.getElementById('video');
      if (!video) return;
      video.classList.toggle('front-camera', cameraFacingMode === 'user');
    }

    function getCameraName() {
      return cameraFacingMode === 'user' ? '전면 카메라' : '후면 카메라';
    }

    function playSuccessSound() {
      beep(880, 0.12, 0.06);
      setTimeout(function() { beep(1175, 0.18, 0.06); }, 120);
    }

    function playFailSound() {
      beep(220, 0.25, 0.08);
      setTimeout(function() { beep(180, 0.25, 0.08); }, 180);
    }

    function unlockSound() {
      beep(1, 0.01, 0.001);
    }

    function beep(frequency, duration, volume) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        gainNode.gain.value = volume;

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        setTimeout(function() {
          oscillator.stop();
          audioCtx.close();
        }, duration * 1000);
      } catch (error) {}
    }

    function speak(text) {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        utterance.pitch = 1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
      } catch (error) {}
    }

    function showWaiting(text) {
      const box = document.getElementById('result');
      box.className = 'result waiting';
      box.innerHTML = escapeHtml(text);
    }

    function showSuccess(text) {
      const box = document.getElementById('result');
      box.className = 'result success';
      box.innerHTML = text;
    }

    function showFail(text) {
      const box = document.getElementById('result');
      box.className = 'result fail';
      box.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
    }

    function setStatus(text) {
      document.getElementById('statusText').textContent = text;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    setStatus('현재 기본 카메라: 전면 카메라\n연결 주소: ' + WEB_APP_URL);
  </script>
</body>
</html>
