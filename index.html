<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출첵 스캐너</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      margin-top: 12px;
    }

    h1 {
      margin: 0;
      color: #0f2e6e;
      font-size: 34px;
      text-align: center;
    }

    .sub {
      margin-top: 8px;
      color: #64748b;
      font-size: 18px;
      text-align: center;
      font-weight: 700;
    }

    video {
      width: 100%;
      margin-top: 18px;
      border-radius: 18px;
      background: #0f172a;
      border: 1px solid #cbd5e1;
    }

    canvas {
      display: none;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      color: white;
    }

    .voice { background: #111827; }
    .start { background: #047857; }
    .stop { background: #dc2626; }
    .manual-btn { background: #2563eb; }

    .result {
      display: block;
      margin-top: 18px;
      padding: 30px 18px;
      border-radius: 20px;
      text-align: center;
      font-weight: 900;
      line-height: 1.45;
      min-height: 110px;
    }

    .success {
      background: #16a34a;
      color: white;
      border: 4px solid #15803d;
      box-shadow: 0 10px 28px rgba(22, 163, 74, 0.35);
    }

    .duplicate {
      background: #dc2626;
      color: white;
      border: 4px solid #991b1b;
      box-shadow: 0 10px 28px rgba(220, 38, 38, 0.35);
    }

    .fail {
      background: #fef2f2;
      color: #dc2626;
      border: 3px solid #ef4444;
    }

    .waiting {
      background: #eff6ff;
      color: #0f2e6e;
      border: 3px solid #bfdbfe;
    }

    .big-name {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .big-type {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .big-time {
      font-size: 22px;
      color: inherit;
      opacity: 0.95;
    }

    .manual {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .manual h2 {
      margin: 0 0 12px 0;
      color: #0f2e6e;
      font-size: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .small {
      margin-top: 14px;
      color: #64748b;
      font-size: 12px;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>출첵 스캐너</h1>
      <div class="sub">직원 QR을 카메라에 보여주세요.</div>

      <div class="buttons">
        <button class="voice" onclick="unlockAudio()">음성 안내 시작</button>
      </div>

      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>

      <div id="result" class="result waiting">
        스캔 대기중
      </div>

      <div class="buttons">
        <button class="start" onclick="startScanner()">스캔 시작</button>
        <button class="stop" onclick="stopScanner()">스캔 중지</button>
      </div>

      <div class="manual">
        <h2>카메라가 안 될 때 직접 입력</h2>
        <input id="manualToken" type="text" placeholder="예: EMP004-ABC12345">
        <button class="manual-btn" onclick="submitManual()">직접 출첵</button>
      </div>

      <div class="small" id="statusText"></div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPDHypVwpaqEdAYUUAj8AGkgaEh4e0zEbp6cr46ru9JldynWDirfV9TpY6DB9JV6aO/exec';

    let videoStream = null;
    let scanTimer = null;
    let isProcessing = false;
    let lastToken = '';
    let lastScanTime = 0;
    let audioCtx = null;

    function unlockAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) {
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        beep(880, 0.08, 0.04);
        speakText('음성 안내가 시작되었습니다');
        showWaiting('음성 안내 준비 완료. 스캔 시작을 눌러주세요.');
      } catch (error) {
        speakText('음성 안내가 시작되었습니다');
      }
    }

    function startScanner() {
      unlockAudio();

      const video = document.getElementById('video');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showFail('이 브라우저는 카메라 기능을 지원하지 않습니다.');
        return;
      }

      stopScanner();
      showWaiting('카메라 시작 중...');

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      })
      .then(function(stream) {
        videoStream = stream;
        video.srcObject = stream;
        return video.play();
      })
      .then(function() {
        showWaiting('카메라 준비 완료. QR을 보여주세요.');
        scanTimer = setInterval(scanFrame, 350);
      })
      .catch(function(error) {
        playFailSound();
        showFail('카메라 시작 실패: ' + error.name + ' / ' + error.message);
      });
    }

    function stopScanner() {
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }

      if (videoStream) {
        videoStream.getTracks().forEach(function(track) {
          track.stop();
        });
        videoStream = null;
      }

      const video = document.getElementById('video');
      if (video) {
        video.srcObject = null;
      }
    }

    function scanFrame() {
      if (isProcessing) return;

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');

      if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) {
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code && code.data) {
        recordAttendance(code.data);
      }
    }

    function submitManual() {
      unlockAudio();

      const token = document.getElementById('manualToken').value.trim();

      if (!token) {
        playFailSound();
        showFail('QR토큰을 입력해주세요.');
        return;
      }

      recordAttendance(token);
    }

    function recordAttendance(token) {
      const now = Date.now();

      if (isProcessing) return;

      if (token === lastToken && now - lastScanTime < 5000) {
        return;
      }

      lastToken = token;
      lastScanTime = now;

      isProcessing = true;
      showWaiting('QR 확인 중...');

      const callbackName = 'attendanceCallback_' + Date.now();

      window[callbackName] = function(result) {
        delete window[callbackName];

        if (result && result.success) {
          const name = result.displayName || result.name || '직원';
          const checkType = result.checkType || '출근';
          const scanTime = result.scanTime || '';

          playSuccessVoice(name, checkType);

          showSuccess(
            '<div class="big-name">' + escapeHtml(name) + '님</div>' +
            '<div class="big-type">정상 ' + escapeHtml(checkType) + ' 처리되었습니다</div>' +
            '<div class="big-time">' + escapeHtml(scanTime) + '</div>'
          );
        } else {
          if (isDuplicateResult(result)) {
            const name = result && (result.displayName || result.name) ? (result.displayName || result.name) : '';
            const scanTime = result && result.scanTime ? result.scanTime : '';

            playDuplicateWarning(name);

            showDuplicate(
              '<div class="big-name">' + escapeHtml(name ? name + '님' : '중복 출첵') + '</div>' +
              '<div class="big-type">이미 출근 처리된 직원입니다</div>' +
              '<div class="big-time">' + escapeHtml(scanTime) + '</div>'
            );
          } else {
            playFailSound();
            speakText('출첵 처리에 실패했습니다');
            showFail(result && result.message ? result.message : '출첵 실패');
          }
        }

        setTimeout(function() {
          isProcessing = false;
          showWaiting('다음 직원 스캔 대기중');
        }, 3000);
      };

      const script = document.createElement('script');
      script.src =
        WEB_APP_URL +
        '?api=attendance' +
        '&token=' + encodeURIComponent(token) +
        '&callback=' + callbackName +
        '&t=' + Date.now();

      script.onerror = function() {
        playFailSound();
        speakText('서버 연결에 실패했습니다');
        showFail('서버 연결 실패');
        delete window[callbackName];
        isProcessing = false;
      };

      document.body.appendChild(script);

      setTimeout(function() {
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }, 10000);
    }

    function isDuplicateResult(result) {
      if (!result) return false;

      const message = String(result.message || '');
      const status = String(result.status || '');
      const code = String(result.code || '');

      return (
        result.duplicate === true ||
        result.isDuplicate === true ||
        status.includes('duplicate') ||
        code.includes('duplicate') ||
        message.includes('이미') ||
        message.includes('중복') ||
        message.includes('처리된') ||
        message.includes('출근 처리')
      );
    }

    function speakText(text) {
      try {
        if (!window.speechSynthesis) return;

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        utterance.pitch = 1;
        utterance.volume = 1;

        window.speechSynthesis.speak(utterance);
      } catch (error) {}
    }

    function playSuccessVoice(name, checkType) {
      try {
        if (navigator.vibrate) {
          navigator.vibrate([150, 70, 150]);
        }

        playSuccessSound();

        const displayName = name || '직원';
        const type = checkType || '출근';
        speakText(displayName + '님 정상 ' + type + ' 처리되었습니다');
      } catch (error) {
        speakText('정상 출근 처리되었습니다');
      }
    }

    function playDuplicateWarning(name) {
      try {
        if (navigator.vibrate) {
          navigator.vibrate([100, 60, 100, 60, 250]);
        }

        playWarningSound();

        setTimeout(function() {
          if (name) {
            speakText(name + '님 이미 출근 처리된 직원입니다');
          } else {
            speakText('이미 출근 처리된 직원입니다');
          }
        }, 700);
      } catch (error) {
        speakText('이미 출근 처리된 직원입니다');
      }
    }

    function playSuccessSound() {
      beep(880, 0.12, 0.06);
      setTimeout(function() {
        beep(1175, 0.18, 0.06);
      }, 120);
    }

    function playFailSound() {
      beep(220, 0.25, 0.08);
      setTimeout(function() {
        beep(180, 0.25, 0.08);
      }, 180);
    }

    function playWarningSound() {
      beep(440, 0.16, 0.09, 'square');
      setTimeout(function() {
        beep(440, 0.16, 0.09, 'square');
      }, 210);
      setTimeout(function() {
        beep(330, 0.22, 0.09, 'square');
      }, 420);
    }

    function beep(frequency, duration, volume, type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;

        if (!audioCtx) {
          audioCtx = new AudioContext();
        }

        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = type || 'sine';
        oscillator.frequency.value = frequency;
        gainNode.gain.value = volume;

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();

        setTimeout(function() {
          oscillator.stop();
        }, duration * 1000);
      } catch (error) {}
    }

    function showWaiting(text) {
      const box = document.getElementById('result');
      box.className = 'result waiting';
      box.innerHTML = text;
    }

    function showSuccess(text) {
      const box = document.getElementById('result');
      box.className = 'result success';
      box.innerHTML = text;
    }

    function showDuplicate(text) {
      const box = document.getElementById('result');
      box.className = 'result duplicate';
      box.innerHTML = text;
    }

    function showFail(text) {
      const box = document.getElementById('result');
      box.className = 'result fail';
      box.innerHTML = escapeHtml(text);
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.getElementById('statusText').textContent =
      '연결 주소: ' + WEB_APP_URL;
  </script>
</body>
</html>
