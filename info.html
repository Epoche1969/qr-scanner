<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>인포 방문확인</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .wrap {
      max-width: 840px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      margin-top: 12px;
    }

    h1 {
      margin: 0;
      color: #0f2e6e;
      font-size: 34px;
      text-align: center;
      letter-spacing: -1px;
    }

    h2 {
      margin: 0 0 12px 0;
      color: #0f2e6e;
      font-size: 23px;
    }

    .sub {
      margin-top: 8px;
      color: #64748b;
      font-size: 18px;
      text-align: center;
      font-weight: 800;
      line-height: 1.4;
    }

    .voice-test {
      margin-top: 14px;
      background: #7c3aed;
      font-size: 18px;
      min-height: 54px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 18px;
    }

    .tab {
      background: #334155;
      padding: 15px 8px;
      font-size: 17px;
      border-radius: 14px;
    }

    .tab.active {
      background: #047857;
    }

    .section {
      display: none;
      margin-top: 20px;
    }

    .section.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 8px;
      color: #0f172a;
      font-size: 17px;
      font-weight: 900;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 2px solid #dbe3ef;
      border-radius: 15px;
      padding: 15px;
      font-size: 19px;
      font-weight: 700;
      outline: none;
      background: #ffffff;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    input[readonly] {
      background: #f1f5f9;
      color: #0f2e6e;
      border-color: #bfdbfe;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 18px 14px;
      margin-top: 16px;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      color: white;
      background: #047857;
      min-height: 62px;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .blue { background: #2563eb; }
    .red { background: #dc2626; }
    .dark { background: #0f172a; }
    .gold { background: #b45309; }
    .green { background: #047857; }

    .result {
      display: block;
      margin-top: 18px;
      padding: 24px 16px;
      border-radius: 22px;
      text-align: center;
      font-weight: 900;
      line-height: 1.45;
      min-height: 88px;
      box-sizing: border-box;
    }

    .waiting {
      background: #eff6ff;
      color: #0f2e6e;
      border: 3px solid #bfdbfe;
    }

    .success {
      background: #16a34a;
      color: white;
      border: 4px solid #15803d;
      box-shadow: 0 10px 28px rgba(22, 163, 74, 0.35);
    }

    .fail {
      background: #fef2f2;
      color: #dc2626;
      border: 3px solid #ef4444;
    }

    .warn {
      background: #fff7ed;
      color: #9a3412;
      border: 3px solid #fed7aa;
    }

    .big {
      font-size: 31px;
      word-break: keep-all;
    }

    .small-line {
      margin-top: 6px;
      font-size: 17px;
      opacity: 0.95;
      word-break: keep-all;
    }

    .staff-box {
      margin-top: 14px;
      padding: 18px;
      border-radius: 18px;
      background: #ecfdf5;
      border: 2px solid #bbf7d0;
      color: #047857;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
    }

    .match-card {
      margin-top: 12px;
      padding: 15px;
      border-radius: 16px;
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      color: #0f2e6e;
      font-weight: 800;
      line-height: 1.65;
    }

    .match-card button {
      margin-top: 10px;
      font-size: 18px;
      min-height: 54px;
    }

    .onsite-box {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 20px;
      background: #fff7ed;
      border: 2px solid #fed7aa;
    }

    .onsite-box.active {
      display: block;
    }

    video {
      width: 100%;
      margin-top: 14px;
      border-radius: 18px;
      background: #0f172a;
      border: 1px solid #cbd5e1;
    }

    canvas {
      display: none;
    }

    .qr-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hint {
      margin-top: 10px;
      padding: 12px;
      border-radius: 15px;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 800;
    }

    .small {
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
      word-break: break-all;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .tabs {
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 30px;
      }

      .big {
        font-size: 27px;
      }

      input,
      select,
      textarea {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>인포 방문확인</h1>
      <div class="sub">직원 QR 확인 · 예약 방문확정 · 워킹 고객 등록</div>

      <button class="voice-test" onclick="testVoice()">음성 테스트</button>

      <div id="mainResult" class="result waiting">
        인포 방문확인 대기중
      </div>

      <div class="tabs">
        <button id="tabQrCheck" class="tab active" onclick="showSection('qrCheck')">고객확인 QR 스캔</button>
        <button id="tabWalking" class="tab" onclick="showSection('walking')">워킹 고객 등록</button>
      </div>

      <div id="sectionQrCheck" class="section active">
        <h2>고객확인 QR 스캔</h2>

        <div class="hint">
          고객이 직원에게 받은 직원 QR 이미지를 스캔합니다.<br>
          담당직원을 확인한 뒤 고객 전체 연락처를 입력하면 방문예약 여부를 확인합니다.
        </div>

        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div class="qr-buttons">
          <button class="blue" onclick="startScanner()">직원 QR 스캔 시작</button>
          <button class="red" onclick="stopScanner()">스캔 중지</button>
        </div>

        <label for="manualQrToken">직원 QR토큰 직접 입력</label>
        <input id="manualQrToken" type="text" placeholder="예: EMP001-ABC12345">
        <button class="dark" onclick="checkManualEmployeeQr()">직원 확인</button>

        <div id="staffBox" class="staff-box">
          담당직원 확인 전
        </div>

        <input id="confirmedStaffName" type="hidden">

        <label for="customerPhoneForSearch">고객 전체 연락처 *</label>
        <input id="customerPhoneForSearch" type="tel" placeholder="예: 010-1234-5678">

        <label for="qrMemo">인포 메모</label>
        <textarea id="qrMemo" placeholder="예: 고객 도착 확인, 동반 1명, 주차 안내 완료 등"></textarea>

        <button class="green" onclick="searchReservationWithStaff()">예약 확인</button>

        <div id="reservationMatches"></div>

        <div id="onsiteBox" class="onsite-box">
          <h2>예약 없음 · 직원QR 현장등록</h2>
          <div class="hint">
            예약은 없지만 직원 QR을 받은 고객입니다.<br>
            담당직원은 위에서 확인된 직원으로 자동 저장됩니다.
          </div>

          <label for="onsiteVisitorName">고객명 *</label>
          <input id="onsiteVisitorName" type="text" placeholder="예: 홍길동">

          <label for="onsitePhone">고객 연락처 *</label>
          <input id="onsitePhone" type="tel" placeholder="예: 010-1234-5678">

          <div class="row">
            <div>
              <label for="onsiteInterestType">관심 타입</label>
              <select id="onsiteInterestType">
                <option value="">선택</option>
                <option value="59타입">59타입</option>
                <option value="74타입">74타입</option>
                <option value="84타입">84타입</option>
                <option value="102타입">102타입</option>
                <option value="펜트하우스">펜트하우스</option>
                <option value="상담 후 결정">상담 후 결정</option>
              </select>
            </div>

            <div>
              <label for="onsiteVisitPurpose">방문 목적</label>
              <select id="onsiteVisitPurpose">
                <option value="">선택</option>
                <option value="관심고객 등록">관심고객 등록</option>
                <option value="청약 상담">청약 상담</option>
                <option value="분양가 상담">분양가 상담</option>
                <option value="동호수 상담">동호수 상담</option>
                <option value="계약 상담">계약 상담</option>
                <option value="기타">기타</option>
              </select>
            </div>
          </div>

          <label for="onsiteMemo">현장등록 메모</label>
          <textarea id="onsiteMemo" placeholder="예: 예약 없음, 직원 QR 지참, 현장 상담 요청 등"></textarea>

          <button class="gold" onclick="submitStaffQrOnsiteVisit()">직원QR 현장등록 저장</button>
        </div>
      </div>

      <div id="sectionWalking" class="section">
        <h2>워킹 고객 등록</h2>

        <div class="hint">
          직원 QR도 없고 방문예약도 없는 일반 홍보관 방문 고객입니다.<br>
          담당직원은 자동으로 “워킹”으로 저장됩니다.
        </div>

        <label for="walkingVisitorName">고객명 *</label>
        <input id="walkingVisitorName" type="text" placeholder="예: 홍길동">

        <label for="walkingPhone">고객 연락처 *</label>
        <input id="walkingPhone" type="tel" placeholder="예: 010-1234-5678">

        <div class="row">
          <div>
            <label for="walkingInterestType">관심 타입</label>
            <select id="walkingInterestType">
              <option value="">선택</option>
              <option value="59타입">59타입</option>
              <option value="74타입">74타입</option>
              <option value="84타입">84타입</option>
              <option value="102타입">102타입</option>
              <option value="펜트하우스">펜트하우스</option>
              <option value="상담 후 결정">상담 후 결정</option>
            </select>
          </div>

          <div>
            <label for="walkingVisitPurpose">방문 목적</label>
            <select id="walkingVisitPurpose">
              <option value="">선택</option>
              <option value="관심고객 등록">관심고객 등록</option>
              <option value="청약 상담">청약 상담</option>
              <option value="분양가 상담">분양가 상담</option>
              <option value="동호수 상담">동호수 상담</option>
              <option value="계약 상담">계약 상담</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </div>

        <label for="walkingMemo">메모</label>
        <textarea id="walkingMemo" placeholder="예: 인포 직접등록, 워킹 방문, 상담 대기 등"></textarea>

        <button class="gold" onclick="submitWalkingVisit()">워킹 방문 저장</button>
      </div>

      <div class="small" id="statusText"></div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPDHypVwpaqEdAYUUAj8AGkgaEh4e0zEbp6cr46ru9JldynWDirfV9TpY6DB9JV6aO/exec';

    let videoStream = null;
    let scanTimer = null;
    let isScanningQr = false;

    function speakText(text) {
      try {
        if (!window.speechSynthesis) return;

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.92;
        utterance.pitch = 1;
        utterance.volume = 1;

        window.speechSynthesis.speak(utterance);
      } catch (error) {}
    }

    function testVoice() {
      speakText('인포 화면 음성 안내가 정상적으로 작동합니다.');
      showWaiting('음성 테스트를 실행했습니다.');
    }

    function showSection(name) {
      document.getElementById('sectionQrCheck').classList.remove('active');
      document.getElementById('sectionWalking').classList.remove('active');

      document.getElementById('tabQrCheck').classList.remove('active');
      document.getElementById('tabWalking').classList.remove('active');

      if (name === 'qrCheck') {
        document.getElementById('sectionQrCheck').classList.add('active');
        document.getElementById('tabQrCheck').classList.add('active');
        speakText('고객확인 큐알 스캔 화면입니다.');
      }

      if (name === 'walking') {
        document.getElementById('sectionWalking').classList.add('active');
        document.getElementById('tabWalking').classList.add('active');
        stopScanner();
        speakText('워킹 고객 등록 화면입니다.');
      }

      showWaiting('인포 방문확인 대기중');
    }

    function apiCall(params, callback) {
      const callbackName = 'infoCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

      window[callbackName] = function(result) {
        delete window[callbackName];
        callback(result);
      };

      const query = Object.keys(params).map(function(key) {
        return encodeURIComponent(key) + '=' + encodeURIComponent(params[key] || '');
      }).join('&');

      const script = document.createElement('script');
      script.src = WEB_APP_URL + '?' + query + '&callback=' + callbackName + '&t=' + Date.now();

      script.onerror = function() {
        delete window[callbackName];
        callback({
          success: false,
          message: '서버 연결 실패',
        });
      };

      document.body.appendChild(script);

      setTimeout(function() {
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }, 10000);
    }

    function startScanner() {
      const video = document.getElementById('video');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showFail('이 브라우저는 카메라 기능을 지원하지 않습니다.');
        speakText('이 브라우저는 카메라 기능을 지원하지 않습니다.');
        return;
      }

      stopScanner();
      showWaiting('카메라 시작 중...');
      speakText('카메라를 시작합니다. 직원 큐알을 보여주세요.');

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      })
      .then(function(stream) {
        videoStream = stream;
        video.srcObject = stream;
        return video.play();
      })
      .then(function() {
        showWaiting('카메라 준비 완료. 직원 QR을 보여주세요.');
        speakText('카메라 준비가 완료되었습니다.');
        scanTimer = setInterval(scanFrame, 350);
      })
      .catch(function(error) {
        showFail('카메라 시작 실패: ' + error.name + ' / ' + error.message);
        speakText('카메라 시작에 실패했습니다.');
      });
    }

    function stopScanner() {
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }

      if (videoStream) {
        videoStream.getTracks().forEach(function(track) {
          track.stop();
        });
        videoStream = null;
      }

      const video = document.getElementById('video');
      if (video) {
        video.srcObject = null;
      }

      isScanningQr = false;
    }

    function scanFrame() {
      if (isScanningQr) return;

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');

      if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) {
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code && code.data) {
        isScanningQr = true;
        checkEmployeeQr(code.data);
      }
    }

    function checkManualEmployeeQr() {
      const qrData = getValue('manualQrToken');

      if (!qrData) {
        showFail('직원 QR토큰을 입력해주세요.');
        speakText('직원 큐알 토큰을 입력해주세요.');
        focusField('manualQrToken');
        return;
      }

      checkEmployeeQr(qrData);
    }

    function checkEmployeeQr(qrData) {
      showWaiting('직원 QR 확인 중입니다...');
      speakText('직원 큐알을 확인 중입니다.');

      apiCall({
        api: 'employeeByQr',
        qrData: qrData,
      }, function(result) {
        isScanningQr = false;

        if (result && result.success) {
          const name = result.displayName || '';

          document.getElementById('confirmedStaffName').value = name;
          document.getElementById('staffBox').textContent = name + ' 담당직원 확인 완료';

          showSuccess(
            '<div class="big">' + escapeHtml(name) + ' 담당직원 확인</div>' +
            '<div class="small-line">고객 전체 연락처를 입력하고 예약 확인을 누르세요.</div>'
          );

          speakText(name + ' 담당직원이 확인되었습니다. 고객 전체 연락처를 입력해주세요.');
          stopScanner();
        } else {
          showFail(result && result.message ? result.message : '직원 QR 확인 실패');
          speakText('직원 큐알 확인에 실패했습니다.');
        }
      });
    }

    function searchReservationWithStaff() {
      const consultantName = getValue('confirmedStaffName');
      const phone = getValue('customerPhoneForSearch');

      if (!consultantName) {
        showFail('먼저 직원 QR을 스캔해서 담당직원을 확인해주세요.');
        speakText('먼저 직원 큐알을 스캔해서 담당직원을 확인해주세요.');
        return;
      }

      if (!phone) {
        showFail('고객 전체 연락처를 입력해주세요.');
        speakText('고객 전체 연락처를 입력해주세요.');
        focusField('customerPhoneForSearch');
        return;
      }

      document.getElementById('reservationMatches').innerHTML = '';
      document.getElementById('onsiteBox').classList.remove('active');

      showWaiting('방문예약을 확인 중입니다...');
      speakText('방문예약을 확인 중입니다.');

      apiCall({
        api: 'searchReservation',
        consultantName: consultantName,
        phone: phone,
      }, function(result) {
        if (!result || !result.success) {
          showFail(result && result.message ? result.message : '예약 검색 실패');
          speakText('예약 검색에 실패했습니다.');
          return;
        }

        if (!result.found) {
          showWarn('방문예약이 없습니다. 직원QR 현장등록으로 저장할 수 있습니다.');
          speakText('방문예약이 없습니다. 직원 큐알 현장등록으로 진행하세요.');

          document.getElementById('onsiteBox').classList.add('active');
          document.getElementById('onsitePhone').value = phone;
          document.getElementById('onsiteVisitorName').focus();
          return;
        }

        const matches = result.matches || [];

        if (matches.length === 1) {
          showSuccess('방문예약 1건이 확인되었습니다.');
          speakText('방문예약이 확인되었습니다. 방문확정 버튼을 눌러주세요.');
        } else {
          showWarn('동일한 예약자가 여러 명 있습니다. 고객명을 확인 후 선택하세요.');
          speakText('동일한 예약자가 여러 명 있습니다. 고객명을 확인 후 선택해주세요.');
        }

        renderReservationMatches(matches, phone);
      });
    }

    function renderReservationMatches(matches, fullPhone) {
      const box = document.getElementById('reservationMatches');

      box.innerHTML = matches.map(function(item) {
        return `
          <div class="match-card">
            <div><b>고객명:</b> ${escapeHtml(item.visitorName || '')}</div>
            <div><b>담당직원:</b> ${escapeHtml(item.consultantName || '')}</div>
            <div><b>관심타입:</b> ${escapeHtml(item.interestType || '')}</div>
            <div><b>방문목적:</b> ${escapeHtml(item.visitPurpose || '')}</div>
            <div><b>방문예정:</b> ${escapeHtml(item.expectedVisitTime || '')}</div>
            <div><b>예약상태:</b> ${escapeHtml(item.reservationStatus || '')}</div>
            <button onclick="confirmReservation('${escapeJs(item.reservationId || '')}', '${escapeJs(fullPhone || '')}')">
              이 예약 방문확정
            </button>
          </div>
        `;
      }).join('');
    }

    function confirmReservation(reservationId, fullPhone) {
      const memo = getValue('qrMemo');

      if (!reservationId) {
        showFail('예약ID가 없습니다.');
        speakText('예약 아이디가 없습니다.');
        return;
      }

      if (!fullPhone) {
        showFail('고객 전체 연락처가 없습니다.');
        speakText('고객 전체 연락처가 없습니다.');
        return;
      }

      showWaiting('예약 방문확정 처리 중입니다...');
      speakText('예약 방문확정 처리 중입니다.');

      apiCall({
        api: 'confirmReservation',
        reservationId: reservationId,
        phone: fullPhone,
        memo: memo,
      }, function(result) {
        if (result && result.success) {
          showSuccess(
            '<div class="big">' + escapeHtml(result.visitorName) + '님 예약방문 확정</div>' +
            '<div class="small-line">담당직원: ' + escapeHtml(result.consultantName || '') + '</div>' +
            '<div class="small-line">상태: 예약방문확정</div>' +
            '<div class="small-line">등록시간: ' + escapeHtml(result.registeredTime || '') + '</div>'
          );

          speakText(result.visitorName + '님 예약방문이 확정되었습니다.');
          resetQrCheckForm();
        } else {
          showFail(result && result.message ? result.message : '예약 방문확정 실패');
          speakText('예약 방문확정에 실패했습니다.');
        }
      });
    }

    function submitStaffQrOnsiteVisit() {
      const consultantName = getValue('confirmedStaffName');
      const visitorName = getValue('onsiteVisitorName');
      const phone = getValue('onsitePhone');
      const interestType = getValue('onsiteInterestType');
      const visitPurpose = getValue('onsiteVisitPurpose');
      const memo = getValue('onsiteMemo');

      if (!consultantName) {
        showFail('담당직원이 확인되지 않았습니다. 직원 QR을 먼저 스캔해주세요.');
        speakText('담당직원이 확인되지 않았습니다. 직원 큐알을 먼저 스캔해주세요.');
        return;
      }

      if (!visitorName) {
        showFail('고객명을 입력해주세요.');
        speakText('고객명을 입력해주세요.');
        focusField('onsiteVisitorName');
        return;
      }

      if (!phone) {
        showFail('고객 연락처를 입력해주세요.');
        speakText('고객 연락처를 입력해주세요.');
        focusField('onsitePhone');
        return;
      }

      showWaiting('직원QR 현장등록 저장 중입니다...');
      speakText('직원 큐알 현장등록을 저장 중입니다.');

      apiCall({
        api: 'directVisit',
        visitorName: visitorName,
        phone: phone,
        interestType: interestType,
        visitPurpose: visitPurpose,
        consultantName: consultantName,
        status: '직원QR현장등록',
        memo: memo,
      }, function(result) {
        if (result && result.success) {
          showSuccess(
            '<div class="big">' + escapeHtml(result.visitorName) + '님 방문 저장 완료</div>' +
            '<div class="small-line">담당직원: ' + escapeHtml(result.consultantName || '') + '</div>' +
            '<div class="small-line">상태: 직원QR현장등록</div>'
          );

          speakText(result.visitorName + '님 방문 저장이 완료되었습니다.');
          resetQrCheckForm();
        } else {
          showFail(result && result.message ? result.message : '직원QR 현장등록 실패');
          speakText('직원 큐알 현장등록에 실패했습니다.');
        }
      });
    }

    function submitWalkingVisit() {
      const visitorName = getValue('walkingVisitorName');
      const phone = getValue('walkingPhone');
      const interestType = getValue('walkingInterestType');
      const visitPurpose = getValue('walkingVisitPurpose');
      const memo = getValue('walkingMemo');

      if (!visitorName) {
        showFail('고객명을 입력해주세요.');
        speakText('고객명을 입력해주세요.');
        focusField('walkingVisitorName');
        return;
      }

      if (!phone) {
        showFail('고객 연락처를 입력해주세요.');
        speakText('고객 연락처를 입력해주세요.');
        focusField('walkingPhone');
        return;
      }

      showWaiting('워킹 고객 방문 저장 중입니다...');
      speakText('워킹 고객 방문을 저장 중입니다.');

      apiCall({
        api: 'directVisit',
        visitorName: visitorName,
        phone: phone,
        interestType: interestType,
        visitPurpose: visitPurpose,
        consultantName: '워킹',
        status: '워킹방문',
        memo: memo,
      }, function(result) {
        if (result && result.success) {
          showSuccess(
            '<div class="big">' + escapeHtml(result.visitorName) + '님 워킹 방문 저장 완료</div>' +
            '<div class="small-line">담당직원: 워킹</div>' +
            '<div class="small-line">상태: 워킹방문</div>'
          );

          speakText(result.visitorName + '님 워킹 방문 저장이 완료되었습니다.');
          resetWalkingForm();
        } else {
          showFail(result && result.message ? result.message : '워킹 방문 저장 실패');
          speakText('워킹 방문 저장에 실패했습니다.');
        }
      });
    }

    function resetQrCheckForm() {
      document.getElementById('manualQrToken').value = '';
      document.getElementById('customerPhoneForSearch').value = '';
      document.getElementById('qrMemo').value = '';
      document.getElementById('reservationMatches').innerHTML = '';

      document.getElementById('onsiteBox').classList.remove('active');
      document.getElementById('onsiteVisitorName').value = '';
      document.getElementById('onsitePhone').value = '';
      document.getElementById('onsiteInterestType').value = '';
      document.getElementById('onsiteVisitPurpose').value = '';
      document.getElementById('onsiteMemo').value = '';

      document.getElementById('confirmedStaffName').value = '';
      document.getElementById('staffBox').textContent = '담당직원 확인 전';
    }

    function resetWalkingForm() {
      document.getElementById('walkingVisitorName').value = '';
      document.getElementById('walkingPhone').value = '';
      document.getElementById('walkingInterestType').value = '';
      document.getElementById('walkingVisitPurpose').value = '';
      document.getElementById('walkingMemo').value = '';
    }

    function getValue(id) {
      return document.getElementById(id).value.trim();
    }

    function focusField(id) {
      setTimeout(function() {
        document.getElementById(id).focus();
      }, 100);
    }

    function showWaiting(text) {
      const box = document.getElementById('mainResult');
      box.className = 'result waiting';
      box.innerHTML = text;
    }

    function showSuccess(text) {
      const box = document.getElementById('mainResult');
      box.className = 'result success';
      box.innerHTML = text;
    }

    function showFail(text) {
      const box = document.getElementById('mainResult');
      box.className = 'result fail';
      box.innerHTML = escapeHtml(text);
    }

    function showWarn(text) {
      const box = document.getElementById('mainResult');
      box.className = 'result warn';
      box.innerHTML = escapeHtml(text);
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJs(value) {
      return String(value || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '\\r');
    }

    document.getElementById('statusText').textContent =
      '연결 주소: ' + WEB_APP_URL;
  </script>
</body>
</html>
