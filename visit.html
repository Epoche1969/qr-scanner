<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>방문예약 등록</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      margin-top: 10px;
    }

    h1 {
      margin: 0;
      color: #0f2e6e;
      font-size: 34px;
      text-align: center;
      letter-spacing: -1px;
    }

    .sub {
      margin-top: 8px;
      color: #64748b;
      font-size: 18px;
      text-align: center;
      font-weight: 800;
      line-height: 1.4;
    }

    .staff-banner {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 18px;
      background: #ecfdf5;
      color: #047857;
      border: 2px solid #bbf7d0;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
    }

    .notice {
      margin-top: 14px;
      padding: 13px;
      border-radius: 16px;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 800;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 8px;
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      border: 2px solid #dbe3ef;
      border-radius: 15px;
      padding: 16px;
      font-size: 20px;
      font-weight: 700;
      outline: none;
      background: #ffffff;
    }

    input[readonly] {
      background: #f1f5f9;
      color: #0f2e6e;
      border-color: #bfdbfe;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 20px 14px;
      margin-top: 18px;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      color: white;
      background: #047857;
      min-height: 68px;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .reset {
      background: #0f172a;
      margin-top: 10px;
      font-size: 20px;
    }

    .result {
      display: block;
      margin-top: 18px;
      padding: 28px 16px;
      border-radius: 22px;
      text-align: center;
      font-weight: 900;
      line-height: 1.45;
      min-height: 95px;
      box-sizing: border-box;
    }

    .waiting {
      background: #eff6ff;
      color: #0f2e6e;
      border: 3px solid #bfdbfe;
    }

    .success {
      background: #16a34a;
      color: white;
      border: 4px solid #15803d;
      box-shadow: 0 10px 28px rgba(22, 163, 74, 0.35);
    }

    .fail {
      background: #fef2f2;
      color: #dc2626;
      border: 3px solid #ef4444;
    }

    .big {
      font-size: 34px;
      word-break: keep-all;
    }

    .time {
      margin-top: 8px;
      font-size: 19px;
      opacity: 0.95;
    }

    .small {
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
      word-break: break-all;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      h1 {
        font-size: 30px;
      }

      .big {
        font-size: 29px;
      }

      input,
      select,
      textarea {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>방문예약 등록</h1>
      <div class="sub">홍보관 방문 예정 고객을 사전 등록합니다.</div>

      <div id="staffBanner" class="staff-banner"></div>

      <div id="result" class="result waiting">
        방문예약 등록 대기중
      </div>

      <div class="notice">
        이 화면은 실제 방문고객 저장이 아니라 <b>방문예약 고객 저장</b>입니다.<br>
        저장된 예약은 인포 화면에서 고객 방문 시 확인 후 실제 방문기록으로 전환됩니다.
      </div>

      <label for="visitorName">고객명 *</label>
      <input id="visitorName" type="text" placeholder="예: 홍길동" autocomplete="name">

      <label for="phoneLast6">전화번호 뒤 6자리 *</label>
      <input
        id="phoneLast6"
        type="tel"
        inputmode="numeric"
        maxlength="6"
        placeholder="예: 345678"
        oninput="onlyDigits6(this)"
      >

      <div class="notice">
        전체 전화번호가 아니라 <b>뒤 6자리만</b> 입력합니다.<br>
        고객이 홍보관 방문 시 인포에서 전체 번호를 받아 뒤 6자리로 예약을 확인합니다.
      </div>

      <div class="row">
        <div>
          <label for="interestType">관심 타입</label>
          <select id="interestType">
            <option value="">선택</option>
            <option value="59타입">59타입</option>
            <option value="74타입">74타입</option>
            <option value="84타입">84타입</option>
            <option value="102타입">102타입</option>
            <option value="펜트하우스">펜트하우스</option>
            <option value="상담 후 결정">상담 후 결정</option>
          </select>
        </div>

        <div>
          <label for="visitPurpose">방문 목적</label>
          <select id="visitPurpose">
            <option value="">선택</option>
            <option value="관심고객 등록">관심고객 등록</option>
            <option value="청약 상담">청약 상담</option>
            <option value="분양가 상담">분양가 상담</option>
            <option value="동호수 상담">동호수 상담</option>
            <option value="계약 상담">계약 상담</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>

      <label for="consultantName">담당직원 *</label>
      <input id="consultantName" type="text" placeholder="예: 김태성">

      <label for="expectedVisitTime">방문예정시간 *</label>
      <input id="expectedVisitTime" type="datetime-local">

      <label for="memo">메모</label>
      <textarea id="memo" placeholder="예: 오후 방문 예정, 84타입 관심, 가족 동반 예정 등"></textarea>

      <button id="submitBtn" onclick="submitReservation()">방문예약 등록</button>
      <button class="reset" onclick="resetForm()">새 예약 입력</button>

      <div class="small" id="statusText"></div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPDHypVwpaqEdAYUUAj8AGkgaEh4e0zEbp6cr46ru9JldynWDirfV9TpY6DB9JV6aO/exec';

    let isSubmitting = false;
    let fixedStaffName = '';

    function initPage() {
      const params = new URLSearchParams(window.location.search);
      const staff = params.get('staff');

      if (staff) {
        fixedStaffName = staff.trim();

        const consultantInput = document.getElementById('consultantName');
        consultantInput.value = fixedStaffName;
        consultantInput.readOnly = true;

        const banner = document.getElementById('staffBanner');
        banner.style.display = 'block';
        banner.textContent = fixedStaffName + ' 담당 방문예약 등록 화면';
      }

      document.getElementById('statusText').textContent =
        '연결 주소: ' + WEB_APP_URL;
    }

    function submitReservation() {
      if (isSubmitting) return;

      const visitorName = getValue('visitorName');
      const phoneLast6 = getValue('phoneLast6');
      const interestType = getValue('interestType');
      const visitPurpose = getValue('visitPurpose');
      const consultantName = fixedStaffName || getValue('consultantName');
      const expectedVisitTime = formatDateTimeLocal(getValue('expectedVisitTime'));
      const memo = getValue('memo');

      if (!visitorName) {
        showFail('고객명을 입력해주세요.');
        focusField('visitorName');
        return;
      }

      if (!phoneLast6 || phoneLast6.length !== 6) {
        showFail('전화번호 뒤 6자리를 정확히 입력해주세요.');
        focusField('phoneLast6');
        return;
      }

      if (!consultantName) {
        showFail('담당직원을 입력해주세요.');
        focusField('consultantName');
        return;
      }

      if (!expectedVisitTime) {
        showFail('방문예정시간을 입력해주세요.');
        focusField('expectedVisitTime');
        return;
      }

      isSubmitting = true;
      document.getElementById('submitBtn').disabled = true;
      showWaiting('방문예약 정보를 저장 중입니다...');

      const callbackName = 'reserveCallback_' + Date.now();

      window[callbackName] = function(result) {
        delete window[callbackName];

        isSubmitting = false;
        document.getElementById('submitBtn').disabled = false;

        if (result && result.success) {
          showSuccess(
            '<div class="big">' + escapeHtml(result.visitorName) + '님 방문예약 완료</div>' +
            '<div class="time">담당직원: ' + escapeHtml(result.consultantName || consultantName) + '</div>' +
            '<div class="time">방문예정: ' + escapeHtml(result.expectedVisitTime || '-') + '</div>' +
            '<div class="time">상태: 예약</div>'
          );

          speakText(result.visitorName + '님 방문예약이 등록되었습니다');

          setTimeout(function() {
            resetForm();
          }, 3000);
        } else {
          const message = result && result.message ? result.message : '방문예약 등록 실패';
          showFail(message);
          speakText('방문예약 등록에 실패했습니다');
        }
      };

      const script = document.createElement('script');
      script.src =
        WEB_APP_URL +
        '?api=reserveVisit' +
        '&visitorName=' + encodeURIComponent(visitorName) +
        '&phoneLast6=' + encodeURIComponent(phoneLast6) +
        '&interestType=' + encodeURIComponent(interestType) +
        '&visitPurpose=' + encodeURIComponent(visitPurpose) +
        '&consultantName=' + encodeURIComponent(consultantName) +
        '&expectedVisitTime=' + encodeURIComponent(expectedVisitTime) +
        '&memo=' + encodeURIComponent(memo) +
        '&callback=' + callbackName +
        '&t=' + Date.now();

      script.onerror = function() {
        showFail('서버 연결 실패');
        speakText('서버 연결에 실패했습니다');
        delete window[callbackName];
        isSubmitting = false;
        document.getElementById('submitBtn').disabled = false;
      };

      document.body.appendChild(script);

      setTimeout(function() {
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }, 10000);
    }

    function resetForm() {
      document.getElementById('visitorName').value = '';
      document.getElementById('phoneLast6').value = '';
      document.getElementById('interestType').value = '';
      document.getElementById('visitPurpose').value = '';

      if (fixedStaffName) {
        document.getElementById('consultantName').value = fixedStaffName;
      } else {
        document.getElementById('consultantName').value = '';
      }

      document.getElementById('expectedVisitTime').value = '';
      document.getElementById('memo').value = '';

      showWaiting('방문예약 등록 대기중');
      focusField('visitorName');
    }

    function onlyDigits6(input) {
      input.value = input.value.replace(/[^0-9]/g, '').slice(0, 6);
    }

    function getValue(id) {
      return document.getElementById(id).value.trim();
    }

    function formatDateTimeLocal(value) {
      if (!value) return '';

      let text = String(value).replace('T', ' ');

      if (text.length === 16) {
        text = text + ':00';
      }

      return text;
    }

    function focusField(id) {
      setTimeout(function() {
        document.getElementById(id).focus();
      }, 100);
    }

    function speakText(text) {
      try {
        if (!window.speechSynthesis) return;

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.9;
        utterance.pitch = 1;
        utterance.volume = 1;

        window.speechSynthesis.speak(utterance);
      } catch (error) {}
    }

    function showWaiting(text) {
      const box = document.getElementById('result');
      box.className = 'result waiting';
      box.innerHTML = text;
    }

    function showSuccess(text) {
      const box = document.getElementById('result');
      box.className = 'result success';
      box.innerHTML = text;
    }

    function showFail(text) {
      const box = document.getElementById('result');
      box.className = 'result fail';
      box.innerHTML = escapeHtml(text);
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    initPage();
  </script>
</body>
</html>
